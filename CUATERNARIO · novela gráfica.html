<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e4e1dc;--ink:#3a2a22;--paper:#faf8f4;--cap:#3a2a22;--capt:#faf3e8;--mut:#7a6a5e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e0c;--ink:#d9cfb6;--paper:#191713;--cap:#d9cfb6;--capt:#16140f;--mut:#9a907c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:14px}
header{text-align:center;max-width:780px;margin:10px auto 0}
h1{font-size:2rem;letter-spacing:.35em;margin:6px 0;font-weight:normal}
header p{color:var(--mut);font-style:italic;margin:0}
.page{max-width:780px;margin:22px auto;background:var(--paper);border:1px solid var(--ink);padding:10px}
.pt{display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pn{border:2px solid var(--ink);overflow:hidden;background:var(--paper)}
.pn.w{grid-column:span 2}
svg{display:block;width:100%;height:auto}
.pn svg{filter:saturate(1.2) contrast(1.05) brightness(1.07)}
.pn svg use{stroke:rgba(60,30,20,.45);stroke-width:.6}
.tx{background:var(--cap);color:var(--capt);padding:8px 10px;font-size:.88rem;line-height:1.35}
.tx b{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.tx i{display:block;margin-top:4px;opacity:.9}
@media(max-width:520px){.grid{grid-template-columns:1fr}.pn.w{grid-column:span 1}}

<script>
let n=0;
const u=(id,x,y,s,c)=>`<use href="#${id}" transform="translate(${x} ${y}) scale(${s})" style="fill:${c};color:${c}"/>`;

const sc=(a,b,i)=>{n++;return `<svg viewBox="0 0 600 260" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><linearGradient id="z${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe8d0" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="hp${n}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(60)"><line x2="0" y2="4" stroke="#8a4a28" stroke-width=".8"/></pattern><pattern id="hq${n}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x2="0" y2="4" stroke="#b5651d" stroke-width=".8"/></pattern><radialGradient id="w${n}"><stop offset=".45" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient><mask id="k${n}"><rect width="600" height="260" fill="url(#w${n})"/></mask><filter id="d${n}"><feTurbulence type="turbulence" baseFrequency=".035" numOctaves="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3"/></filter><radialGradient id="v${n}"><stop offset=".5" stop-opacity="0"/><stop offset="1" stop-color="#4a2a1a" stop-opacity=".3"/></radialGradient><filter id="f${n}"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="600" height="260" fill="url(#g${n})"/><g filter="url(#d${n})">${i}</g><rect y="110" width="600" height="150" fill="url(#z${n})"/><rect width="600" height="260" fill="url(#hp${n})" opacity=".16"/><rect width="600" height="260" fill="url(#hq${n})" opacity=".3" mask="url(#k${n})"/><rect width="600" height="260" filter="url(#f${n})" opacity=".24" style="mix-blend-mode:overlay"/><rect width="600" height="260" fill="url(#v${n})"/></svg>`};

const P=[
["I · El último acto del Cenozoico",[
[sc('#05070f','#14305a',stars()+C(300,340,215,'#5aa0d8')+C(300,346,205,'#173f66')+T(300,70,'CUATERNARIO','#e8dcc0',34)+T(300,100,'2,58 millones de años · hoy','#b9b19a',14)),'Prólogo','La Tierra lleva 4.500 millones de años cambiando. Este es el capítulo más reciente, y el único que alguien ha podido escribir.','w'],
[sc('#d9b88a','#6b4a2f',mtn('#5b4636',200)+mtn('#3a2b20',240)+T(300,40,'OROGENIA ALPINA','#2a1d12',18)),'Paleógeno · 66–23 M.a.','Se levantan el Himalaya, los Andes, los Pirineos y los Alpes. Los mamíferos y las aves se expanden.',''],

[sc('#9fb8c8','#e8f0f4',C(480,60,70,'rgba(255,255,255,.35)')+C(480,60,28,'#fff7d0')+mtn('#b8cfdc',170)+mtn('#cfdde6',200)+Pa('M0 260V190Q100 175 200 195T400 190T600 185V260Z','#eef5f8')+Pa('M0 260V225Q200 205 400 225T600 215V260Z','#dbe9f0')+Pa('M80 215L130 238M300 207L360 242M470 212L520 240','none','stroke="#6fa8cc" stroke-width="3"')+Pa('M20 200l30 -25 20 25zM520 195l25 -30 25 30z','#bfe0f0')+Pa('M0 120h140M380 95h200M200 150h120','none','stroke="rgba(255,255,255,.7)" stroke-width="2"')+u('h',300,138,1,'#22201e')+T(300,40,'GLACIACIÓN','#34495a',22)),'Casquetes de hielo','El enfriamiento general del clima, iniciado antes, culmina en enormes mantos de hielo sobre Norteamérica y Eurasia. El Cuaternario es la era del hielo por antonomasia.','w'],
[sc('#10151c','#10151c',Pa('M0 130Q75 40 150 130T300 130T450 130T600 130','none','stroke="#8fd3ff" stroke-width="3"')+T(75,75,'interglaciar','#8fd3ff',12)+T(225,190,'glaciar','#8fd3ff',12)+T(300,245,'≈ 100.000 años por ciclo','#b9b19a',12)),'Alternancia','Periodos glaciares e interglaciares se suceden, ligados a variaciones de la órbita terrestre.',''],
[sc('#1d3550','#0b1a2b',Pa('M0 260V110L260 110Q330 170 600 190V260Z','#4a3b2c')+R(0,190,600,70,'#2f6fa3')+`<path d="M0 190H600" stroke="#fff" stroke-dasharray="6 4"/>`+T(520,182,'nivel actual','#fff',11)+`<path d="M0 250H600" stroke="#9cd" stroke-dasharray="6 4"/>`+T(440,244,'glaciación: hasta −120 m','#cfe',11)),'El mar retrocede','Con tanta agua atrapada en hielo, el mar bajó más de cien metros y la costa se desplazó kilómetros.','']
]],
["III · La edad de los gigantes",[
[sc('#2b1d3a','#e08a4a',C(300,165,150,'rgba(255,170,90,.12)')+C(300,165,95,'rgba(255,190,110,.2)')+C(300,165,58,'#ffe2a8')+Pa('M0 70Q150 50 300 75T600 60V85Q450 100 300 90T0 95Z','rgba(255,150,100,.25)')+Pa('M0 112Q200 97 400 117T600 107V124Q400 132 200 127T0 130Z','rgba(255,120,90,.2)')+mtn('#6b4a5a',185)+mtn('#3a2a36',215)+Pa('M0 260V205Q150 195 300 205T600 200V260Z','#1c140e')+grass(212,'#0a0705',40)+Pa('M60 50q8-8 16 0q8-8 16 0M120 38q6-6 12 0q6-6 12 0','none','stroke="#2a1a20" stroke-width="2"')+u('m',130,162,.55,'#3a2634')+u('m',205,166,.45,'#3a2634')+u('m',60,138,1,'#1d1318')+Pa('M440 212L270 228L420 234Z','rgba(0,0,0,.35)')+u('m',420,104,1.5,D)),'Pleistoceno · 2,58 M.a. – 11.700 años','Los mamíferos alcanzan su máximo desarrollo. El mamut lanudo recorre la estepa fría, defendido del hielo por su pelaje y su grasa.','w'],
[sc('#2a3b4a','#8aa3b3',mtn('#4a5d6b',200)+R(180,185,240,75,'#2c2824')+u('t',250,128,1.3,'#14110e')),'Depredadores','Tigres de dientes de sable, osos de las cavernas y leones acechan a una fauna enorme.',''],
[sc('#c9d6dc','#eef3f5',R(0,210,600,50,'#fff')+u('p',60,150,1.2,'#2e4a3a')+u('p',150,160,1,'#2e4a3a')+u('p',480,145,1.3,'#2e4a3a')+u('m',300,140,.9,'#3b2f26')),'Megafauna','Rinocerontes lanudos, bisontes y grandes herbívoros dominan los paisajes helados.','']
]],
["N · Antes del Cuaternario",[
[sc('#2f6fa3','#1d4a73',R(0,0,250,95,'#6a8a4a')+R(350,165,250,95,'#6a8a4a')+Pa('M250 80L350 165L335 180L240 100Z','#8a9a5a')+ln('M0 130Q40 120 80 130T160 130','#9cd',2)+ln('M440 60Q480 50 520 60T600 60','#9cd',2)+T(300,30,'ISTMO DE PANAMÁ','#e8dcc0',16)+T(100,60,'N. AMÉRICA','#143',11)+T(500,215,'S. AMÉRICA','#143',11)),'Un istmo cambia las corrientes','Hace unos 3 millones de años el istmo de Panamá separó el Atlántico del Pacífico. Muchos investigadores lo citan, junto a otros factores, entre las causas del enfriamiento que desemboca en el Cuaternario.','w'],
[sc('#05070f','#14305a',stars()+C(300,130,110,'#2f5a82')+C(300,130,70,'#cfe3ee')+C(300,130,35,'#fff')+T(300,135,'POLO NORTE','#34495a',11)+T(300,250,'2,58 M.a. · EL HIELO SE INSTALA','#c9bfa5',12)),'Año cero: 2,58 M.a.','Las glaciaciones del hemisferio norte se vuelven recurrentes. Ese es el límite oficial que marca el inicio del Cuaternario.','w']
]],
["N · El reloj de las glaciaciones",[
[sc('#05070f','#14305a',stars()+ln('M70 140A230 80 0 1 0 530 140A230 80 0 1 0 70 140Z','#8fd3ff',2,5)+C(300,140,26,'#ffcf6a')+C(140,185,12,'#3d78a8')+T(300,30,'CICLOS DE MILANKOVITCH','#e8dcc0',16)),'Tres ritmos orbitales','La forma de la órbita (unos 100.000 años), la inclinación del eje (unos 41.000) y la precesión (unos 23.000) cambian cuánta radiación solar recibe cada hemisferio. Son el marcapasos de las glaciaciones.','w'],
[sc('#cfe0ea','#dbe9f0',R(0,170,600,90,'#f4f8fa')+C(80,50,30,'#ffd08a')+ln('M100 70L300 175L440 70','#ff9a4a',3)+T(300,235,'el hielo refleja la luz solar','#34495a',14)+T(440,55,'albedo','#34495a',14)),'Retroalimentaciones','Más hielo refleja más luz y enfría aún más el planeta; con menos CO₂ el enfriamiento se amplifica. Así, pequeñas variaciones orbitales producen grandes glaciaciones.','w']
]],

[sc('#f2c27a','#8a5a2a',C(480,70,60,'rgba(255,240,190,.35)')+C(480,70,36,'#fff2c0')+Pa('M0 260V200Q200 190 600 205V260Z','#6a4a22')+grass(206,'#3a2a10',40)+acacia(110,200,1.4)+acacia(480,205,1.1)+u('h',230,138,1,D)+u('h',290,142,.95,D)+u('h',345,146,.9,D)),'Homo erectus','Hace cerca de 1,8 millones de años Homo erectus camina erguido por África y Eurasia. Talla bifaces y, con el tiempo, aprende a controlar el fuego.','w'],
[sc('#14120f','#14120f',ln('M80 200Q200 120 300 150T520 80','#c9a227',3,6)+T(80,225,'ÁFRICA','#e8dcc0',12)+T(300,130,'DMANISI','#e8dcc0',12)+T(520,60,'ASIA','#e8dcc0',12)+C(300,150,5,'#c9a227')),'Fuera de África','En Dmanisi (Georgia) aparecieron fósiles de hace unos 1,8 millones de años: de los primeros homininos conocidos fuera de África.','w']

["IV · Atapuerca: los primeros europeos",[
[sc('#3b2a1c','#120c07',bands(['#5a4330','#4a3626','#6b5038','#3f2d1f','#523a28','#2e2016'])+C(300,150,34,'#e6dcc3')+R(284,172,32,20,'#e6dcc3')+C(288,146,7,'#1a120b')+C(312,146,7,'#1a120b')+T(300,30,'GRAN DOLINA · SIERRA DE ATAPUERCA','#e8dcc0',16)),'Burgos, hace 850.000 años','En la Gran Dolina aparecieron los restos de Homo antecessor, de los homininos más antiguos de Europa occidental. El Pleistoceno no era solo cosa de mamuts: ya había humanos arcaicos resistiendo en un continente frío.','w'],
[sc('#050507','#1d1710',Pa('M200 0H400L340 140H260Z','#14100b')+Pa('M290 0H310L335 190H265Z','rgba(255,230,160,.18)')+bones+T(500,30,'SIMA DE LOS HUESOS','#c9bfa5',12)),'Sima de los Huesos','Hace unos 430.000 años: restos de al menos 28 individuos de un linaje cercano a los neandertales, en el fondo de una sima. Aún se debate cómo llegaron allí.',''],
[sc('#2a2118','#120d08',Pa('M300 40Q350 120 300 220Q250 120 300 40Z','#8a8274')+Pa('M300 60Q330 120 300 200','none','stroke="#b5ac98" stroke-width="2"')+T(300,245,'piedra tallada','#c9bfa5',12)),'La primera tecnología','Tallar piedra, dominar el fuego y cazar en grupo: durante cientos de miles de años, el ingenio fue la defensa contra un clima cambiante.','']
]],

[sc('#c9d6dc','#eef3f5',mtn('#8aa0ae',170)+R(0,205,600,55,'#fff')+u('p',60,150,1.2,'#2e4a3a')+u('p',130,160,1,'#2e4a3a')+u('m',300,140,.9,'#3b2f26')+u('t',440,150,.8,'#14110e')+grass(208,'#999',40)),'Fauna ibérica','Rinocerontes, osos de las cavernas, hienas, linces y ciervos gigantes poblaron la Península; los mamuts llegaron al norte peninsular. Atapuerca y otras cuevas guardan sus huesos.','w'],
[sc('#05060a','#1a1018',stars()+R(0,200,600,60,'#0c0a08')+u('t',200,140,1.6,D)+C(210,152,3,'#ffd24a')+C(225,152,3,'#ffd24a')+C(430,170,3,'#ff6a3a')+C(445,170,3,'#ff6a3a')),'La noche de los depredadores','Leopardos, leones de las cavernas y hienas disputaban presas y refugios a los grupos humanos. Las cuevas guardan huellas de esa convivencia peligrosa.','w']
]],

[sc('#9fb8c8','#e8f0f4',Pa('M0 40L180 80Q220 220 300 225Q380 220 420 80L600 40V260H0Z','#6f8794')+Pa('M205 225Q300 238 395 225L415 115L185 115Z','#eef5f8')+Pa('M0 40L180 80L150 120Z','rgba(0,0,0,.25)')+T(300,40,'VALLE EN U','#34495a',18)),'Valles, circos y morrenas','Los glaciares excavan valles en U, circos y aristas, y depositan morrenas. Los Pirineos albergaron glaciares de decenas de kilómetros, como el del Gállego, durante las glaciaciones.','w'],
